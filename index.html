<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米阳简介大合集 | 品牌包装案例展示</title>
<style>
  :root {
    --bg-0: #0a0a0f;
    --bg-1: #12121a;
    --bg-2: #1a1a25;
    --fg-0: #ffffff;
    --fg-1: #d4d4e0;
    --fg-2: #8888a0;
    --accent: #e8b04a;
    --accent-2: #ff6b35;
    --accent-soft: rgba(232, 176, 74, 0.15);
    --border: rgba(255, 255, 255, 0.08);
    --radius: 12px;
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
    --shadow-xl: 0 40px 120px rgba(0,0,0,0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-0);
    color: var(--fg-0);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ======= 加载动画 ======= */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg-0);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .logo-ring {
    width: 80px; height: 80px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  #loader .load-text {
    margin-top: 24px; font-size: 14px; color: var(--fg-2); letter-spacing: 4px;
  }
  #loader .load-progress {
    margin-top: 12px; font-size: 12px; color: var(--accent);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ======= 背景粒子 ======= */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(232,176,74,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255,107,53,0.06) 0%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: auto, auto, 60px 60px, 60px 60px;
  }

  /* ======= 顶部工具栏 ======= */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 60px;
    background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    transition: transform 0.4s ease;
  }
  .topbar.hidden { transform: translateY(-100%); }

  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #000; font-size: 16px;
    box-shadow: 0 4px 16px rgba(232,176,74,0.3);
  }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
  .brand-sub { font-size: 11px; color: var(--fg-2); letter-spacing: 2px; }

  .top-center {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-2);
    padding: 6px 14px; border-radius: 100px;
    border: 1px solid var(--border);
  }
  .page-current {
    font-size: 16px; font-weight: 700; color: var(--accent); min-width: 30px; text-align: center;
  }
  .page-sep { color: var(--fg-2); font-size: 14px; }
  .page-total { font-size: 14px; color: var(--fg-2); }
  .progress-bar {
    width: 120px; height: 3px;
    background: var(--bg-0); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--fg-1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ======= 章节侧栏 ======= */
  .sidebar {
    position: fixed; left: -320px; top: 0; bottom: 0; z-index: 90;
    width: 320px; background: var(--bg-1);
    border-right: 1px solid var(--border);
    transition: left 0.4s cubic-bezier(0.4,0,0.2,1);
    overflow-y: auto;
  }
  .sidebar.open { left: 0; }
  .sidebar-header {
    padding: 80px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h3 { font-size: 14px; font-weight: 600; letter-spacing: 3px; color: var(--fg-2); text-transform: uppercase; }
  .sidebar-list { padding: 12px 0; }
  .sidebar-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px; cursor: pointer;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
  }
  .sidebar-item:hover { background: var(--accent-soft); }
  .sidebar-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .sidebar-thumb {
    width: 48px; height: 27px; border-radius: 4px; background: var(--bg-2);
    object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .sidebar-meta { flex: 1; min-width: 0; }
  .sidebar-meta .pnum { font-size: 12px; color: var(--fg-2); }
  .sidebar-meta .ptitle { font-size: 13px; color: var(--fg-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  /* 滚动条 */
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--bg-2); border-radius: 3px; }
  .sidebar::-webkit-scrollbar-thumb:hover { background: var(--fg-2); }

  /* ======= 主舞台 ======= */
  .stage {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 80px 40px 80px;
  }

  .page-container {
    position: relative;
    width: 100%; height: 100%;
    max-width: calc(100vh * 16 / 9);
    max-height: calc(100vw * 9 / 16);
    aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center;
  }

  .page-slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: translateX(60px) scale(0.97);
    transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1), transform 0.5s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
  }
  .page-slide.active {
    opacity: 1; transform: translateX(0) scale(1);
    pointer-events: auto;
    z-index: 2;
  }
  .page-slide.prev { transform: translateX(-60px) scale(0.97); }

  .page-img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: var(--radius);
    box-shadow: var(--shadow-xl);
    transition: transform 0.4s ease;
  }
  .page-slide.active .page-img:hover { transform: scale(1.02); }

  /* ======= 页面文字层 ======= */
  .page-text-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: flex-start;
    padding: 30px 50px;
    pointer-events: none;
  }
  .page-caption {
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
    padding: 14px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    max-width: 60%;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.5s ease 0.3s;
  }
  .page-slide.active .page-caption {
    transform: translateY(0);
    opacity: 1;
  }
  .page-caption .pc-title {
    font-size: 18px; font-weight: 600; color: var(--accent);
    margin-bottom: 6px;
  }
  .page-caption .pc-body {
    font-size: 13px; color: var(--fg-1); line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ======= 左右导航按钮 ======= */
  .nav-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(26,26,37,0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--fg-0); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
    transition: all 0.3s ease;
  }
  .nav-arrow:hover {
    background: var(--accent); color: #000; border-color: var(--accent);
    transform: translateY(-50%) scale(1.1);
    box-shadow: 0 8px 32px rgba(232,176,74,0.4);
  }
  .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-arrow svg { width: 24px; height: 24px; }
  .nav-prev { left: 28px; }
  .nav-next { right: 28px; }

  /* ======= 底部进度条+缩略图 ======= */
  .bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    height: 80px;
    background: linear-gradient(0deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
    backdrop-filter: blur(10px);
    display: flex; align-items: center;
    padding: 0 24px; gap: 16px;
    transition: transform 0.4s ease;
  }
  .bottombar.hidden { transform: translateY(100%); }

  .thumb-strip {
    flex: 1;
    display: flex; gap: 10px;
    overflow-x: auto;
    padding: 10px 4px;
    scroll-behavior: smooth;
  }
  .thumb-strip::-webkit-scrollbar { height: 0; }
  .thumb {
    width: 120px; height: 68px; flex-shrink: 0;
    border-radius: 6px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s ease;
    position: relative;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.6);
    transition: all 0.25s ease;
  }
  .thumb:hover img { filter: brightness(0.9); transform: scale(1.05); }
  .thumb.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,176,74,0.3); }
  .thumb.active img { filter: brightness(1); }
  .thumb .thumb-num {
    position: absolute; bottom: 4px; right: 4px;
    font-size: 10px; color: #fff; background: rgba(0,0,0,0.6);
    padding: 2px 5px; border-radius: 3px;
  }

  .bottom-info {
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .zoom-control {
    display: flex; gap: 4px;
  }

  /* ======= 全屏模式 ======= */
  body.fullscreen .topbar, body.fullscreen .bottombar { opacity: 0; }
  body.fullscreen .topbar:hover, body.fullscreen .bottombar:hover { opacity: 1; }
  body.fullscreen .nav-arrow { opacity: 0.4; }
  body.fullscreen .nav-arrow:hover { opacity: 1; }

  /* ======= 章节过渡特效 ======= */
  .page-slide.chapter-start .page-img {
    animation: chapterIn 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes chapterIn {
    0% { transform: scale(1.1); filter: blur(20px) brightness(0); opacity: 0; }
    100% { transform: scale(1); filter: blur(0) brightness(1); opacity: 1; }
  }

  /* ======= 缩放模式 ======= */
  body.zoom-in .page-container { max-width: 95vw; max-height: 90vh; }
  body.zoom-in .page-img { box-shadow: var(--shadow-xl); }

  /* ======= 响应式 ======= */
  @media (max-width: 768px) {
    .stage { padding: 60px 16px 100px; }
    .nav-arrow { width: 44px; height: 44px; }
    .nav-prev { left: 12px; }
    .nav-next { right: 12px; }
    .topbar { padding: 0 12px; height: 50px; }
    .brand-sub, .progress-bar { display: none; }
    .bottombar { height: 64px; padding: 0 12px; }
    .thumb { width: 80px; height: 45px; }
    .page-caption { max-width: 80%; padding: 10px 14px; }
    .page-caption .pc-title { font-size: 14px; }
    .page-caption .pc-body { font-size: 11px; -webkit-line-clamp: 2; }
  }

  /* ======= 章节进度点 ======= */
  .chapter-dots {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 50;
  }
  .chapter-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .chapter-dot:hover { background: var(--fg-1); }
  .chapter-dot.active {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    transform: scale(1.4);
  }
  .chapter-dot::after {
    content: attr(data-label);
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-size: 11px; white-space: nowrap;
    background: var(--bg-2); padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--border);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .chapter-dot:hover::after { opacity: 1; }

  /* ======= 页面切换提示 ======= */
  .page-flash {
    position: fixed; inset: 0; z-index: 40;
    background: white; opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .page-flash.active { opacity: 0.15; }

  /* ======= 搜索跳转 ======= */
  .jump-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
  }
  .jump-overlay.open { display: flex; }
  .jump-box {
    background: var(--bg-1); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 24px;
    width: 320px; box-shadow: var(--shadow-xl);
  }
  .jump-box h4 { font-size: 13px; color: var(--fg-2); letter-spacing: 2px; margin-bottom: 16px; }
  .jump-input {
    width: 100%; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--fg-0); padding: 12px 16px;
    font-size: 32px; font-weight: 700; text-align: center;
    outline: none; transition: all 0.2s ease;
  }
  .jump-input:focus { border-color: var(--accent); }
  .jump-hint { margin-top: 12px; font-size: 12px; color: var(--fg-2); text-align: center; }

  /* ======= 图片加载动画 ======= */
  .page-img { opacity: 0; transition: opacity 0.3s ease, transform 0.4s ease, box-shadow 0.4s ease; }
  .page-img.loaded { opacity: 1; }

  /* ======= 章节标识横幅 ======= */
  .chapter-banner {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #000; font-weight: 700;
    padding: 8px 28px; border-radius: 100px;
    font-size: 14px; letter-spacing: 4px;
    opacity: 0; transition: all 0.6s ease 0.1s;
    box-shadow: 0 8px 32px rgba(232,176,74,0.4);
    white-space: nowrap;
  }
  .page-slide.active .chapter-banner {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- 加载 -->
<div id="loader">
  <div class="logo-ring"></div>
  <div class="load-text">LOADING</div>
  <div class="load-progress" id="loadProgress">0%</div>
</div>

<!-- 背景 -->
<div class="bg-grid"></div>

<!-- 顶部栏 -->
<div class="topbar" id="topbar">
  <div class="brand">
    <button class="icon-btn" id="menuBtn" title="目录 (M)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand-logo">米</div>
    <div>
      <div class="brand-name">米阳简介大合集</div>
      <div class="brand-sub">MIYANG · BRAND &amp; PACKAGING</div>
    </div>
  </div>
  <div class="top-center">
    <span class="page-current" id="pageCurrent">1</span>
    <span class="page-sep">/</span>
    <span class="page-total" id="pageTotal">109</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="zoomOut" title="缩小 (-)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="icon-btn" id="zoomIn" title="放大 (+)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="icon-btn" id="jumpBtn" title="跳转 (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn" id="fsBtn" title="全屏 (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </div>
</div>

<!-- 目录侧栏 -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>目录 · CONTENTS</h3>
  </div>
  <div class="sidebar-list" id="sidebarList"></div>
</div>

<!-- 主舞台 -->
<div class="stage">
  <div class="page-container" id="pageContainer"></div>
</div>

<!-- 左右箭头 -->
<button class="nav-arrow nav-prev" id="navPrev" title="上一页 (←)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button class="nav-arrow nav-next" id="navNext" title="下一页 (→)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<!-- 右侧章节点 -->
<div class="chapter-dots" id="chapterDots"></div>

<!-- 底部缩略图 -->
<div class="bottombar" id="bottombar">
  <div class="thumb-strip" id="thumbStrip"></div>
</div>

<!-- 跳转框 -->
<div class="jump-overlay" id="jumpOverlay">
  <div class="jump-box">
    <h4>跳转到第几页</h4>
    <input type="number" class="jump-input" id="jumpInput" min="1" max="109" placeholder="1-109">
    <div class="jump-hint">按 Enter 确认 · Esc 取消</div>
  </div>
</div>

<!-- 翻页闪白 -->
<div class="page-flash" id="pageFlash"></div>

<script>
/* ========== 页面数据（有文字的页面） ========== */
const PAGE_TEXTS = {
  2:  { title: '品牌主张', body: '做品牌找米阳  策划设计两头强' },
  15: { title: '三证护航', body: '三证护航，封杀区域品牌。行业第一，行业唯一，占领行业心智资源制高点。' },
  16: { title: '市场战略 · 加速全国化', body: '2024年全国门店营业数突破10000家，2025年突破30000家。1.区域化品牌 → 2.全国化品牌 → 3.万店品牌。' },
  17: { title: '市场战 · 质量与体量并进', body: '一二线城市做质，三四线城市做量。大城市开小店，小城市开大店。2341突破方案。' },
  55: { title: '智能制造业全案', body: '中国燃气动力领军品牌' },
  63: { title: '荣誉资质', body: '国家级高新技术企业' }
};

/* ========== 章节划分 ========== */
const CHAPTERS = [
  { page: 1,  label: '封面 · Cover' },
  { page: 2,  label: '品牌主张' },
  { page: 3,  label: '品牌形象篇' },
  { page: 15, label: '战略规划篇' },
  { page: 18, label: '案例展示 · 快消食品' },
  { page: 30, label: '案例展示 · 茶叶饮品' },
  { page: 42, label: '案例展示 · 美妆日化' },
  { page: 55, label: '智能制造行业' },
  { page: 63, label: '资质与荣誉' },
  { page: 70, label: '更多案例展示' },
  { page: 85, label: '包装设计作品' },
  { page: 100, label: '结语 / Back Cover' }
];

const TOTAL_PAGES = 109;
let currentPage = 1;
let imageBase = 'compressed/';
// 图片加载：优先用内嵌的 IMAGE_DATA（base64），回退到相对路径
function getImgSrc(prefix, filename) {
  const base = filename.replace(/\.(webp|jpg)$/, '');
  const prefixKey = filename.endsWith('.webp') ? 'big_' : 'thumb_';
  const key = prefixKey + base;
  if (typeof IMAGE_DATA !== 'undefined' && IMAGE_DATA[key]) return IMAGE_DATA[key];
  return prefix + filename;
}

/* ========== 初始化 ========== */
function init() {
  buildPageSlides();
  buildThumbStrip();
  buildSidebar();
  buildChapterDots();
  preloadImages();
  bindEvents();
  goToPage(1, true);
}

/* ========== 构建页面幻灯片 ========== */
function buildPageSlides() {
  const container = document.getElementById('pageContainer');
  let html = '';
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const p = PAGE_TEXTS[i];
    html += `
      <div class="page-slide" data-page="${i}">
        <img class="page-img" data-src="${getImgSrc(imageBase, 'page_'+String(i).padStart(3,'0')+'.webp')}" alt="第${i}页">
        ${getChapterBanner(i)}
        ${p ? `
          <div class="page-text-overlay">
            <div class="page-caption">
              ${p.title ? `<div class="pc-title">${p.title}</div>` : ''}
              ${p.body ? `<div class="pc-body">${p.body}</div>` : ''}
            </div>
          </div>` : ''}
      </div>
    `;
  }
  container.innerHTML = html;
}

function getChapterBanner(pageNum) {
  const ch = CHAPTERS.find(c => c.page === pageNum);
  return ch ? `<div class="chapter-banner">${ch.label}</div>` : '';
}

/* ========== 构建缩略图 ========== */
function buildThumbStrip() {
  const strip = document.getElementById('thumbStrip');
  let html = '';
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    html += `
      <div class="thumb" data-page="${i}">
        <img data-src="${getImgSrc('thumbs/', 'page_'+String(i).padStart(3,'0')+'.jpg')}" alt="">
        <span class="thumb-num">${i}</span>
      </div>
    `;
  }
  strip.innerHTML = html;
}

/* ========== 构建侧栏目录 ========== */
function buildSidebar() {
  const list = document.getElementById('sidebarList');
  let html = '';
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const ch = CHAPTERS.find(c => c.page === i);
    const title = ch ? ch.label : (PAGE_TEXTS[i]?.title || `第 ${i} 页`);
    html += `
      <div class="sidebar-item" data-page="${i}">
        <img class="sidebar-thumb" data-src="${getImgSrc('thumbs/', 'page_'+String(i).padStart(3,'0')+'.jpg')}" alt="">
        <div class="sidebar-meta">
          <div class="pnum">P.${i}</div>
          <div class="ptitle">${title}</div>
        </div>
      </div>
    `;
  }
  list.innerHTML = html;
}

/* ========== 构建章节点 ========== */
function buildChapterDots() {
  const dots = document.getElementById('chapterDots');
  dots.innerHTML = CHAPTERS.map(c =>
    `<div class="chapter-dot" data-page="${c.page}" data-label="${c.label}" title="P.${c.page} ${c.label}"></div>`
  ).join('');
}

/* ========== 快速加载：第一页立即可见 ========== */
function preloadImages() {
  const allImgs = document.querySelectorAll('[data-src]');
  
  // 立即加载第一页（0号slide）的大图
  const firstBig = document.querySelector('.page-slide[data-page="1"] .page-img');
  if (firstBig) {
    firstBig.src = firstBig.dataset.src;
    firstBig.removeAttribute('data-src');
    firstBig.onload = () => {
      firstBig.classList.add('loaded');
      // 第一页大图到位，立即隐藏 loader
      document.getElementById('loadProgress').textContent = '就绪';
      setTimeout(() => document.getElementById('loader').classList.add('hidden'), 200);
      // 然后开始懒加载其他图片
      lazyLoadRest();
    };
  } else {
    lazyLoadRest();
  }
  
  // 缩略图也立即批量加载（小文件）
  const thumbs = document.querySelectorAll('.thumb img[data-src], .sidebar-thumb[data-src]');
  thumbs.forEach((img, i) => {
    setTimeout(() => {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
      img.onload = () => img.classList.add('loaded');
    }, i * 20); // 每20ms加载一张，避免请求风暴
  });
}

function lazyLoadRest() {
  const imgs = document.querySelectorAll('.page-slide .page-img[data-src]');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
        img.onload = () => img.classList.add('loaded');
        io.unobserve(img);
      }
    });
  }, { rootMargin: '100px' });
  imgs.forEach(img => io.observe(img));
}

/* ========== 翻页 ========== */
function goToPage(target, silent) {
  target = Math.max(1, Math.min(TOTAL_PAGES, target));
  const isFirstCall = !document.querySelector('.page-slide.active');
  if (target === currentPage && !isFirstCall) return;
  
  const dir = target > currentPage ? 'next' : 'prev';
  
  // 更新幻灯片
  document.querySelectorAll('.page-slide').forEach(s => {
    const p = parseInt(s.dataset.page);
    s.classList.remove('active', 'prev');
    if (p === target) s.classList.add('active');
    if (p === currentPage) s.classList.add('prev');
  });
  
  currentPage = target;
  
  // 更新UI
  document.getElementById('pageCurrent').textContent = target;
  document.getElementById('progressFill').style.width = (target / TOTAL_PAGES * 100) + '%';
  
  // 导航按钮状态
  document.getElementById('navPrev').disabled = target <= 1;
  document.getElementById('navNext').disabled = target >= TOTAL_PAGES;
  
  // 缩略图
  document.querySelectorAll('.thumb').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.page) === target);
    if (parseInt(t.dataset.page) === target) {
      t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
  
  // 侧栏
  document.querySelectorAll('.sidebar-item').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.page) === target);
  });
  
  // 章节点
  let currentChapter = CHAPTERS[0];
  for (const ch of CHAPTERS) {
    if (target >= ch.page) currentChapter = ch;
  }
  document.querySelectorAll('.chapter-dot').forEach(d => {
    d.classList.toggle('active', parseInt(d.dataset.page) === currentChapter.page);
  });
  
  // 翻页闪光
  if (!silent) {
    const flash = document.getElementById('pageFlash');
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 150);
  }
  
  // 章节起始页：播放章节特效
  const chBanner = document.querySelector('.page-slide.active .chapter-banner');
  if (chBanner) {
    const slide = document.querySelector('.page-slide.active');
    slide.classList.add('chapter-start');
    setTimeout(() => slide.classList.remove('chapter-start'), 800);
  }
}

/* ========== 事件绑定 ========== */
function bindEvents() {
  // 键盘
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('jumpOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closeJump();
      if (e.key === 'Enter') confirmJump();
      return;
    }
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': goToPage(currentPage - 1); break;
      case 'ArrowRight': case 'd': case 'D': case ' ': case 'Enter': goToPage(currentPage + 1); break;
      case 'Home': case 'g': case 'G': openJump(); break;
      case 'Escape': closeJump(); closeSidebar(); break;
      case 'f': case 'F': toggleFullscreen(); break;
      case 'm': case 'M': toggleSidebar(); break;
      case '+': case '=': zoomIn(); break;
      case '-': case '_': zoomOut(); break;
    }
  });
  
  // 按钮
  document.getElementById('navPrev').onclick = () => goToPage(currentPage - 1);
  document.getElementById('navNext').onclick = () => goToPage(currentPage + 1);
  document.getElementById('menuBtn').onclick = toggleSidebar;
  document.getElementById('fsBtn').onclick = toggleFullscreen;
  document.getElementById('jumpBtn').onclick = openJump;
  document.getElementById('zoomIn').onclick = zoomIn;
  document.getElementById('zoomOut').onclick = zoomOut;
  
  // 缩略图点击（事件委托）
  document.getElementById('thumbStrip').onclick = (e) => {
    const t = e.target.closest('.thumb');
    if (t) goToPage(parseInt(t.dataset.page));
  };
  
  // 侧栏点击
  document.getElementById('sidebarList').onclick = (e) => {
    const item = e.target.closest('.sidebar-item');
    if (item) {
      goToPage(parseInt(item.dataset.page));
      closeSidebar();
    }
  };
  
  // 章节点点击
  document.getElementById('chapterDots').onclick = (e) => {
    const d = e.target.closest('.chapter-dot');
    if (d) goToPage(parseInt(d.dataset.page));
  };
  
  // 触摸滑动
  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  document.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      goToPage(dx < 0 ? currentPage + 1 : currentPage - 1);
    }
  });
  
  // 自动隐藏工具栏
  let hideTimer;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('fullscreen-auto');
    clearTimeout(hideTimer);
    document.getElementById('topbar').style.transform = 'translateY(0)';
    document.getElementById('bottombar').style.transform = 'translateY(0)';
    hideTimer = setTimeout(() => {
      if (document.fullscreenElement) {
        document.getElementById('topbar').style.transform = 'translateY(-100%)';
        document.getElementById('bottombar').style.transform = 'translateY(100%)';
      }
    }, 3000);
  });
  
  // 跳转框
  document.getElementById('jumpOverlay').onclick = (e) => {
    if (e.target.id === 'jumpOverlay') closeJump();
  };
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

function zoomIn() { document.body.classList.add('zoom-in'); }
function zoomOut() { document.body.classList.remove('zoom-in'); }

function openJump() {
  document.getElementById('jumpOverlay').classList.add('open');
  const input = document.getElementById('jumpInput');
  input.value = currentPage;
  setTimeout(() => input.focus(), 100);
}
function closeJump() {
  document.getElementById('jumpOverlay').classList.remove('open');
}
function confirmJump() {
  const v = parseInt(document.getElementById('jumpInput').value);
  if (v >= 1 && v <= TOTAL_PAGES) {
    goToPage(v);
    closeJump();
  }
}

/* ========== 启动 ========== */
init();
</script>
